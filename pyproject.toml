[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "identity-fabric-benchmarks"
version = "0.1.0"
description = "Adversarial benchmarks for human, workload, AI-agent and physical-machine identity"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["iam", "pam", "agent identity", "authorization", "benchmark", "physical ai"]

[project.scripts]
identity-fabric-bench = "identity_fabric_benchmarks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
