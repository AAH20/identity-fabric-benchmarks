name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . ruff==0.16.3
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples
      - run: python -m unittest discover -s tests -v
      - run: identity-fabric-bench validate
      - run: identity-fabric-bench run --output reports/reference-result.json
